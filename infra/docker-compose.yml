# CityGo local infrastructure — Redis + optional MinIO.
# MySQL 8 使用本机 Windows 服务（citygo_dev / citygo_test），不在此容器化。
# 用法：启动 Docker Desktop 后执行  docker compose -f infra/docker-compose.yml up -d
# MinIO（S3 兼容文件存储适配验证用）默认不启动：加 --profile minio 启用。
services:
  redis:
    image: redis:7-alpine
    container_name: citygo-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    # Retain jti revocations and rate limits across restart/recreate. Do not remove this volume while tokens remain valid.
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    image: nginx:stable-alpine@sha256:970364228b1e4f932abc22d321932816782cca8a20b85a77552a7cfe9acfb3b5
    container_name: citygo-web
    profiles: ["web"]
    ports:
      - "127.0.0.1:8180:80"
    environment:
      CITYGO_NGINX_BACKEND: ${CITYGO_NGINX_BACKEND:-host.docker.internal:8083}
      NGINX_ENVSUBST_FILTER: "^CITYGO_"
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/citygo.docker.conf.template:/etc/nginx/templates/default.conf.template:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio:
    image: citygo/minio:source-9e49d5e7a648
    build:
      context: ./minio
    pull_policy: never
    container_name: citygo-minio
    profiles: ["minio"]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${CITYGO_MINIO_ROOT_USER:-citygo}
      MINIO_ROOT_PASSWORD: ${CITYGO_MINIO_ROOT_PASSWORD:-change-me}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  redis-data:
    name: citygo-redis-data
  minio-data:
